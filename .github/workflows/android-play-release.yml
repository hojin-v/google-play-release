name: Reusable Google Play release
on:
  workflow_call:
    inputs:
      operation:
        type: string
        default: prepare
      tooling_ref:
        type: string
        required: true
      version_code:
        type: string
        default: ''
      rollout:
        type: string
        default: '0.1'
      candidate_run_id:
        description: Preparation run whose tested artifacts must be reused for production
        type: string
        default: ''
      approval:
        description: Project-relative artifact-bound production approval JSON
        type: string
        default: ''
      evidence:
        description: Project-relative physical-device observations JSON
        type: string
        default: ''
      sdk_packages:
        type: string
        default: ''
    secrets:
      PLAY_KEYSTORE_BASE64:
        required: false
      PLAY_STORE_PASSWORD:
        required: false
      PLAY_KEY_ALIAS:
        required: false
      PLAY_KEY_PASSWORD:
        required: false
      PLAY_SERVICE_ACCOUNT_JSON:
        required: false
permissions:
  contents: read
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: google-play-${{ github.repository }}
      cancel-in-progress: false
    environment: ${{ (inputs.operation == 'release' || inputs.operation == 'promote') && 'google-play-production' || 'google-play-test' }}
    env:
      OPERATION: ${{ inputs.operation }}
      APPROVAL: ${{ inputs.approval }}
      EVIDENCE: ${{ inputs.evidence }}
      ROLLOUT: ${{ inputs.rollout }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hojin-v/google-play-release
          ref: ${{ inputs.tooling_ref }}
          path: .play-tooling
          persist-credentials: false
      - name: Validate operation and app toolchain before reading credentials
        id: config
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          SDK_PACKAGES: ${{ inputs.sdk_packages }}
        run: |
          case "$OPERATION" in prepare|draft|sync_listing|release|promote) ;; *) exit 1 ;; esac
          if [[ "$OPERATION" == release || "$OPERATION" == promote ]]; then
            test -f "$APPROVAL" && test -f "$EVIDENCE"
            [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          fi
          python3 - <<'PY'
          import json, os
          config = json.load(open('play/release.json'))
          packages = os.environ['SDK_PACKAGES'] or ' '.join(config.get('android_sdk_packages', ['platforms;android-36', 'build-tools;35.0.0']))
          java = str(config.get('java_version', '17'))
          if not java.isdigit() or '\n' in packages or '\r' in packages:
              raise ValueError('Invalid toolchain configuration')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'java={java}\nsdk={packages}\nartifact_dir={config["output_path"]}\n')
          PY
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ steps.config.outputs.java }}
          distribution: temurin
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install app-specific Android toolchain
        env:
          SDK_PACKAGES: ${{ steps.config.outputs.sdk }}
        run: |
          read -r -a packages <<< "$SDK_PACKAGES"
          sdkmanager "${packages[@]}"
      - name: Restore upload signing key for preparation only
        if: inputs.operation != 'release' && inputs.operation != 'promote'
        env:
          PLAY_KEYSTORE_BASE64: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
          PLAY_STORE_PASSWORD: ${{ secrets.PLAY_STORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          test -n "$PLAY_KEYSTORE_BASE64" && test -n "$PLAY_STORE_PASSWORD" && test -n "$PLAY_KEY_ALIAS" && test -n "$PLAY_KEY_PASSWORD"
          printf '%s' "$PLAY_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/play-upload.jks"
          chmod 600 "$RUNNER_TEMP/play-upload.jks"
          echo "PLAY_KEYSTORE_FILE=$RUNNER_TEMP/play-upload.jks" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        if: inputs.operation != 'release' && inputs.operation != 'promote'
        with:
          node-version: '22'
      - name: Install optional browser screenshot tooling
        if: inputs.operation != 'release' && inputs.operation != 'promote'
        run: |
          if python3 -c 'import json,sys; sys.exit(not bool(json.load(open("play/release.json")).get("screenshot_config")))'; then
            npm ci --prefix .play-tooling
            (cd .play-tooling && npx playwright install --with-deps chromium)
          fi
      - name: Build and audit the signed test candidate
        if: inputs.operation != 'release' && inputs.operation != 'promote'
        env:
          PLAY_STORE_PASSWORD: ${{ secrets.PLAY_STORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: .play-tooling/bin/play-release --project "$GITHUB_WORKSPACE" prepare
      - uses: actions/upload-artifact@v4
        if: inputs.operation != 'release' && inputs.operation != 'promote'
        with:
          name: play-release
          path: ${{ steps.config.outputs.artifact_dir }}/
          if-no-files-found: error
      - name: Reuse tested candidate without rebuilding
        if: inputs.operation == 'release' || inputs.operation == 'promote'
        uses: actions/download-artifact@v4
        with:
          name: play-release
          path: ${{ steps.config.outputs.artifact_dir }}/
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
      - name: Select exact approved artifacts and check production gate
        if: inputs.operation == 'release' || inputs.operation == 'promote'
        run: |
          VALIDATED_AAB="$(python3 - <<'PY'
          import json, os, pathlib, shutil
          root = pathlib.Path.cwd()
          config = json.load(open('play/release.json'))
          artifact = json.load(open(os.environ['APPROVAL']))['artifact']
          folder = root / config['output_path'] / f"{artifact['version_name']}-{artifact['version_code']}"
          apk = root / config['apk_path']
          apk.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2(folder / 'device-test.apk', apk)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'VALIDATED_AAB={folder / "app.aab"}\n')
          print(folder / "app.aab")
          PY
          )"
          .play-tooling/bin/play-release --project "$GITHUB_WORKSPACE" production-check \
            --aab "$VALIDATED_AAB" --approval "$APPROVAL" --evidence "$EVIDENCE" --rollout "$ROLLOUT"
      - uses: ruby/setup-ruby@v1
        if: inputs.operation != 'prepare'
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: .play-tooling
      - name: Execute requested operation
        if: inputs.operation != 'prepare'
        env:
          PLAY_CREDENTIALS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          test -n "$PLAY_CREDENTIALS"
          printf '%s' "$PLAY_CREDENTIALS" > "$RUNNER_TEMP/play-service-account.json"
          chmod 600 "$RUNNER_TEMP/play-service-account.json"
          export PLAY_SERVICE_ACCOUNT_JSON="$RUNNER_TEMP/play-service-account.json"
          if [[ "$OPERATION" == release ]]; then
            .play-tooling/bin/play-fastlane --project "$GITHUB_WORKSPACE" android release "aab:$VALIDATED_AAB" "rollout:$ROLLOUT" "approval:$APPROVAL" "evidence:$EVIDENCE"
          elif [[ "$OPERATION" == promote ]]; then
            [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]
            .play-tooling/bin/play-fastlane --project "$GITHUB_WORKSPACE" android promote "aab:$VALIDATED_AAB" "version_code:$VERSION_CODE" from:internal to:production "rollout:$ROLLOUT" "approval:$APPROVAL" "evidence:$EVIDENCE"
          else
            aab="$(python3 -c 'import json; print(json.load(open("play/release.json"))["bundle_path"])')"
            if [[ "$OPERATION" == sync_listing ]]; then
              .play-tooling/bin/play-fastlane --project "$GITHUB_WORKSPACE" android sync_listing "aab:$aab" acknowledge_shared_listing:true
            else
              .play-tooling/bin/play-fastlane --project "$GITHUB_WORKSPACE" android draft "aab:$aab"
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always() && inputs.operation != 'prepare'
        with:
          name: play-remote-status
          path: |
            ${{ steps.config.outputs.artifact_dir }}/**/remote-*.json
            ${{ steps.config.outputs.artifact_dir }}/**/submission-receipt.json
            build/play-edit-status.json
          if-no-files-found: warn
      - name: Remove temporary credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/play-upload.jks" "$RUNNER_TEMP/play-service-account.json"
